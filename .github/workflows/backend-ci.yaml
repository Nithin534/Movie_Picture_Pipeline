name: Backend Continuous Integration

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-ci.yaml"
      - ".github/actions/backend-deps/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python, restore cache, install dependencies
        uses: ./.github/actions/backend-deps

      - name: Run flake8
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python, restore cache, install dependencies
        uses: ./.github/actions/backend-deps

      - name: Run pytest
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python, restore cache, install dependencies
        uses: ./.github/actions/backend-deps

      # CI only proves the Dockerfile builds cleanly; nothing is pushed
      # or deployed from this workflow.
      - name: Build application with Docker
        working-directory: starter/backend
        run: docker build --tag mp-backend:ci-${{ github.sha }} .

  comment-on-pr:
    name: Comment CI result on PR
    needs: [lint, test, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              lint: '${{ needs.lint.result }}',
              test: '${{ needs.test.result }}',
              build: '${{ needs.build.result }}',
            };
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌');
            const body = [
              '### Backend CI result',
              `- Lint: ${icon(results.lint)} ${results.lint}`,
              `- Test: ${icon(results.test)} ${results.test}`,
              `- Build: ${icon(results.build)} ${results.build}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail workflow if any job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
