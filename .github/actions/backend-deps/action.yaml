name: "Backend dependency setup"
description: >
  Sets up Python 3.10, restores the pipenv virtualenv cache, and installs
  dependencies (including dev-packages, since flake8 lives there). Assumes
  the caller already ran actions/checkout. Used by every lint/test/build
  job in backend-ci.yaml and backend-cd.yaml.

inputs:
  working-directory:
    description: "Path to the backend app"
    required: false
    default: "starter/backend"
  python-version:
    required: false
    default: "3.10"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pipenv
      shell: bash
      run: pip install pipenv

    - name: Cache pipenv virtualenv
      id: pipenv-cache
      uses: actions/cache@v4
      with:
        path: ~/.local/share/virtualenvs
        key: ${{ runner.os }}-pipenv-${{ hashFiles(format('{0}/Pipfile.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-pipenv-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # --dev is required: flake8 lives in [dev-packages] in the Pipfile.
      run: pipenv install --dev